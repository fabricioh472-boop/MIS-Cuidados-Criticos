<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consultas - Cuidados Críticos</title>

<style>
    body {
        font-family: Arial;
        background: #eaf6ff;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #0077b6;
    }

    .card {
        background: white;
        padding: 15px;
        margin: 15px 0;
        border-radius: 10px;
        box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }

    button {
        background: #00b4d8;
        color: white;
        border: none;
        padding: 8px 12px;
        margin-top: 5px;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background: #0077b6;
    }

    input {
        padding: 5px;
        margin: 5px;
    }

    pre {
        background: #f1f1f1;
        padding: 10px;
        border-radius: 5px;
    }
</style>
</head>

<body>

<h1>CONSULTAS - UCI</h1>

<script>
const API = "https://cuidados-criticos-production.up.railway.app";

/* =========================
   1. LISTADO GENERAL
========================= */
async function listadoGeneral() {
    const r = await fetch(`${API}/listado-general`);
    const d = await r.json();
    document.getElementById("r1").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   2. ALERTAS POR NIVEL
========================= */
async function alertasNivel() {
    const r = await fetch(`${API}/alertas-por-nivel`);
    const d = await r.json();
    document.getElementById("r2").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   3. SUMA FC
========================= */
async function sumaFC() {
    const c = document.getElementById("fcCodigo").value;
    const r = await fetch(`${API}/frecuencia-cardiaca-por-paciente?codigo=${c}`);
    const d = await r.json();
    document.getElementById("r3").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   4. ALERTA POR CODIGO
========================= */
async function alertaCodigo() {
    const c = document.getElementById("codAlerta").value;
    const r = await fetch(`${API}/Alerta-por-codigo/${c}`);
    const d = await r.json();
    document.getElementById("r4").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   5. SIGNO SIN ALERTA
========================= */
async function sinAlerta() {
    const r = await fetch(`${API}/Signo-sin-alerta`);
    const d = await r.json();
    document.getElementById("r5").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   6. ESTADO PACIENTE
========================= */
async function estadoPaciente() {
    const c = document.getElementById("pacEstado").value;
    const r = await fetch(`${API}/estado-actual-paciente/${c}`);
    const d = await r.json();
    document.getElementById("r6").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   7. HISTORIAL
========================= */
async function historial() {
    const c = document.getElementById("hist").value;
    const r = await fetch(`${API}/historial-signos/${c}`);
    const d = await r.json();
    document.getElementById("r7").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   8. MAS ALERTAS
========================= */
async function masAlertas() {
    const r = await fetch(`${API}/Paciente-con-mas-alertas`);
    const d = await r.json();
    document.getElementById("r8").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   9. SIN ALERTAS
========================= */
async function sinAlertas() {
    const r = await fetch(`${API}/Paciente-sin-alerta`);
    const d = await r.json();
    document.getElementById("r9").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   10. OXIGENO BAJO
========================= */
async function oxigeno() {
    const r = await fetch(`${API}/Oxigeno%20bajo`);
    const d = await r.json();
    document.getElementById("r10").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   11. CANTIDAD SIGNOS
========================= */
async function cantidad() {
    const r = await fetch(`${API}/Cantidad-signos`);
    const d = await r.json();
    document.getElementById("r11").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   12. ULTIMAS ALERTAS
========================= */
async function ultimas() {
    const r = await fetch(`${API}/Mostrar-ultimas-alertas`);
    const d = await r.json();
    document.getElementById("r12").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   13. PROMEDIO FC
========================= */
async function promedio() {
    const c = document.getElementById("prom").value;
    const r = await fetch(`${API}/promedio-fc/${c}`);
    const d = await r.json();
    document.getElementById("r13").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   14. CRITICOS
========================= */
async function criticos() {
    const r = await fetch(`${API}/Pacientes-criticos-con-alerta`);
    const d = await r.json();
    document.getElementById("r14").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   15. FILTRAR
========================= */
async function filtrar() {
    const fcMin = document.getElementById("fcMin").value;
    const fcMax = document.getElementById("fcMax").value;
    const sat = document.getElementById("sat").value;

    const r = await fetch(`${API}/filtrar-pacientes-rango?fcMin=${fcMin}&fcMax=${fcMax}&satMin=${sat}`);
    const d = await r.json();

    document.getElementById("r15").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   16. COMPARAR
========================= */
async function comparar() {
    const c1 = document.getElementById("c1").value;
    const c2 = document.getElementById("c2").value;

    const r = await fetch(`${API}/comparar-pacientes?cod1=${c1}&cod2=${c2}`);
    const d = await r.json();

    document.getElementById("r16").innerHTML = JSON.stringify(d, null, 2);
}

/* =========================
   17. VARIABILIDAD
========================= */
async function variabilidad() {
    const fi = document.getElementById("fi").value;
    const ff = document.getElementById("ff").value;

    const r = await fetch(`${API}/variabilidad-signos?fechaInicio=${fi}&fechaFin=${ff}`);
    const d = await r.json();

    document.getElementById("r17").innerHTML = JSON.stringify(d, null, 2);
}
</script>

---

<!-- UI -->
<div class="card">
<button onclick="listadoGeneral()">Listado General</button>
<pre id="r1"></pre>
</div>

<div class="card">
<button onclick="alertasNivel()">Alertas por nivel</button>
<pre id="r2"></pre>
</div>

<div class="card">
<input id="fcCodigo" placeholder="Codigo paciente">
<button onclick="sumaFC()">Sumar FC</button>
<pre id="r3"></pre>
</div>

<div class="card">
<input id="codAlerta" placeholder="Codigo alerta">
<button onclick="alertaCodigo()">Buscar alerta</button>
<pre id="r4"></pre>
</div>

<div class="card">
<button onclick="sinAlerta()">Signos sin alerta</button>
<pre id="r5"></pre>
</div>

<div class="card">
<input id="pacEstado" placeholder="Codigo paciente">
<button onclick="estadoPaciente()">Estado paciente</button>
<pre id="r6"></pre>
</div>

<div class="card">
<input id="hist" placeholder="Historial paciente">
<button onclick="historial()">Historial</button>
<pre id="r7"></pre>
</div>

<div class="card">
<button onclick="masAlertas()">Paciente más alerta</button>
<pre id="r8"></pre>
</div>

<div class="card">
<button onclick="sinAlertas()">Pacientes sin alerta</button>
<pre id="r9"></pre>
</div>

<div class="card">
<button onclick="oxigeno()">Oxígeno bajo</button>
<pre id="r10"></pre>
</div>

<div class="card">
<button onclick="cantidad()">Cantidad signos</button>
<pre id="r11"></pre>
</div>

<div class="card">
<button onclick="ultimas()">Últimas alertas</button>
<pre id="r12"></pre>
</div>

<div class="card">
<input id="prom" placeholder="Codigo paciente">
<button onclick="promedio()">Promedio FC</button>
<pre id="r13"></pre>
</div>

<div class="card">
<button onclick="criticos()">Críticos</button>
<pre id="r14"></pre>
</div>

<div class="card">
<input id="fcMin" placeholder="FC min">
<input id="fcMax" placeholder="FC max">
<input id="sat" placeholder="Sat min">
<button onclick="filtrar()">Filtrar</button>
<pre id="r15"></pre>
</div>

<div class="card">
<input id="c1" placeholder="Paciente 1">
<input id="c2" placeholder="Paciente 2">
<button onclick="comparar()">Comparar</button>
<pre id="r16"></pre>
</div>

<div class="card">
<input id="fi" placeholder="Fecha inicio">
<input id="ff" placeholder="Fecha fin">
<button onclick="variabilidad()">Variabilidad</button>
<pre id="r17"></pre>
</div>

</body>
</html>

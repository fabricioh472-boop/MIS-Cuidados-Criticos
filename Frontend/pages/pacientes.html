<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pacientes - Sistema UCI</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf6ff;
            padding: 20px;
        }

        h1, h2 {
            color: #0077b6;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }

        button {
            background: #0077b6;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #005f87;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #90e0ef;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

<h1>Gestión de Pacientes</h1>

<!-- ================= LISTAR ================= -->
<div class="container">
    <h2>Pacientes</h2>

    <button onclick="listarPacientes()">Listar Pacientes</button>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
            </tr>
        </thead>
        <tbody id="tablaPacientes"></tbody>
    </table>
</div>

<!-- ================= CREAR ================= -->
<div class="container">
    <h2>Crear Paciente</h2>

    <input id="codigo" placeholder="Código">
    <input id="nombre" placeholder="Nombre">
    <button onclick="crearPaciente()">Crear</button>
</div>

<!-- ================= BUSCAR ================= -->
<div class="container">
    <h2>Buscar Paciente</h2>

    <input id="codBuscar" placeholder="Código">
    <button onclick="buscarPaciente()">Buscar</button>

    <p id="resultado"></p>
</div>

<!-- ================= ACTUALIZAR ================= -->
<div class="container">
    <h2>Actualizar Paciente</h2>

    <input id="codUpdate" placeholder="Código">
    <input id="nombreUpdate" placeholder="Nuevo nombre">
    <button onclick="actualizarPaciente()">Actualizar</button>
</div>

<!-- ================= ELIMINAR ================= -->
<div class="container">
    <h2>Eliminar Paciente</h2>

    <input id="codDelete" placeholder="Código">
    <button onclick="eliminarPaciente()">Eliminar</button>
</div>

<script>

const API = "https://cuidados-criticos-production.up.railway.app/api";

/* ================= LISTAR ================= */
async function listarPacientes() {
    const r = await fetch(API + "/Paciente");
    const data = await r.json();

    document.getElementById("tablaPacientes").innerHTML =
        data.map(p => `
            <tr>
                <td>${p.codigo}</td>
                <td>${p.nomre}</td>
            </tr>
        `).join("");
}

/* ================= CREAR ================= */
async function crearPaciente() {
    const dto = {
        codigo: document.getElementById("codigo").value,
        nombre: document.getElementById("nombre").value
    };

    await fetch(API + "/Paciente", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dto)
    });

    listarPacientes();
}

/* ================= BUSCAR ================= */
async function buscarPaciente() {
    const codigo = document.getElementById("codBuscar").value;

    const r = await fetch(API + "/Paciente/" + codigo);

    if (!r.ok) {
        document.getElementById("resultado").innerText = "No encontrado";
        return;
    }

    const data = await r.json();

    document.getElementById("resultado").innerText =
        `${data.codigo} - ${data.nomre}`;
}

/* ================= ACTUALIZAR ================= */
async function actualizarPaciente() {
    const codigo = document.getElementById("codUpdate").value;
    const nombre = document.getElementById("nombreUpdate").value;

    await fetch(API + "/Paciente/" + codigo, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nombre)
    });

    listarPacientes();
}

/* ================= ELIMINAR ================= */
async function eliminarPaciente() {
    const codigo = document.getElementById("codDelete").value;

    await fetch(API + "/Paciente/" + codigo, {
        method: "DELETE"
    });

    listarPacientes();
}

</script>

</body>
</html>

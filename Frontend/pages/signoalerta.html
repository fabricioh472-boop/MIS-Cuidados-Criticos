<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Signo - Alerta</title>

<style>
body{
    font-family: Arial;
    background:#e6f7ff;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#0077b6;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, button{
    padding:10px;
    margin:5px;
}

button{
    background:#00b4d8;
    border:none;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0077b6;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0077b6;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>Relación Signo Vital - Alerta</h1>

<!-- FORM -->
<h3>Crear relación</h3>

<input id="codigoSigno" placeholder="Código Signo Vital">
<input id="codigoAlerta" placeholder="Código Alerta">
<button onclick="crear()">Guardar</button>

<p id="msg"></p>

<hr>

<!-- LISTADO -->
<h3>Listado</h3>
<button onclick="listar()">Cargar datos</button>

<table>
<thead>
<tr>
<th>Signo Vital</th>
<th>Alerta</th>
</tr>
</thead>

<tbody id="tabla"></tbody>
</table>

</div>

<script>

const API = "https://cuidados-criticos-production.up.railway.app/api/SignoAlerta";

// LISTAR
async function listar(){
    try{
        const res = await fetch(API);
        const data = await res.json();

        document.getElementById("tabla").innerHTML =
        data.map(x => `
            <tr>
                <td>${x.signosVitales}</td>
                <td>${x.alerta}</td>
            </tr>
        `).join("");
    }catch(err){
        console.log(err);
    }
}

// CREAR RELACIÓN
async function crear(){

    const dto = {
        codigoSigno: document.getElementById("codigoSigno").value,
        codigoAlerta: document.getElementById("codigoAlerta").value
    };

    try{
        const res = await fetch(API, {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify(dto)
        });

        const msg = await res.text();
        document.getElementById("msg").innerText = msg;

        listar(); // refrescar

    }catch(err){
        document.getElementById("msg").innerText = "Error al crear relación";
        console.log(err);
    }
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Signos Vitales</title>

<style>
body{
    font-family: Arial;
    background:#e6f7ff;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#0077b6;
}

.container{
    display:grid;
    grid-template-columns: repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#0096c7;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0077b6;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    border:1px solid #ccc;
    padding:5px;
    text-align:center;
}
</style>
</head>

<body>

<h1>⚕️ SIGNOS VITALES</h1>

<div class="container">

<!-- CREATE -->
<div class="card">
<h3>Crear</h3>
<input id="codigo" placeholder="codigo">
<input id="fc" type="number" placeholder="frecuencia">
<input id="sat" type="number" placeholder="saturacion">
<input id="presion" placeholder="presion">
<button onclick="crear()">Guardar</button>
</div>

<!-- LIST -->
<div class="card">
<h3>Lista</h3>
<button onclick="listar()">Cargar</button>
<table>
<thead>
<tr>
<th>Codigo</th>
<th>FC</th>
<th>Sat</th>
<th>Presion</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<!-- SEARCH -->
<div class="card">
<h3>Buscar</h3>
<input id="buscarCod" placeholder="codigo">
<button onclick="buscar()">Buscar</button>
<p id="res"></p>
</div>

<!-- UPDATE -->
<div class="card">
<h3>Actualizar</h3>
<input id="uCod" placeholder="codigo">
<input id="uFc" type="number" placeholder="fc">
<input id="uSat" type="number" placeholder="sat">
<input id="uPre" placeholder="presion">
<button onclick="actualizar()">Actualizar</button>
</div>

<!-- DELETE -->
<div class="card">
<h3>Eliminar</h3>
<input id="dCod" placeholder="codigo">
<button onclick="eliminar()">Eliminar</button>
</div>

<!-- DASHBOARD -->
<div class="card">
<h3>Dashboard CC</h3>
<button onclick="dashboard()">Ver</button>
<ul id="dash"></ul>
</div>

</div>

<script>

const API="https://cuidados-criticos-production.up.railway.app/api/SignoVital";

// CREATE
async function crear(){
await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
codigo:document.getElementById("codigo").value,
frecuencia_cardiaca:Number(document.getElementById("fc").value),
saturacion_oxigeno:Number(document.getElementById("sat").value),
presion_arterial:document.getElementById("presion").value
})
});

listar();
}

// LIST
async function listar(){
const r=await fetch(API);
const d=await r.json();

document.getElementById("tabla").innerHTML=
d.map(x=>`
<tr>
<td>${x.codigo}</td>
<td>${x.frecuencia_cardiaca}</td>
<td>${x.saturacion_oxigeno}</td>
<td>${x.presion_arterial}</td>
</tr>
`).join("");
}

// SEARCH
async function buscar(){
const c=document.getElementById("buscarCod").value;
const r=await fetch(API+"/"+c);

if(!r.ok){
document.getElementById("res").innerText="No encontrado";
return;
}

const d=await r.json();

document.getElementById("res").innerText=
`FC:${d.frecuencia_cardiaca} | Sat:${d.saturacion_oxigeno}`;
}

// UPDATE
async function actualizar(){
const c=document.getElementById("uCod").value;

await fetch(API+"/"+c,{
method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
frecuencia_cardiaca:Number(document.getElementById("uFc").value),
saturacion_oxigeno:Number(document.getElementById("uSat").value),
presion_arterial:document.getElementById("uPre").value
})
});

alert("Actualizado");
listar();
}

// DELETE
async function eliminar(){
const c=document.getElementById("dCod").value;

await fetch(API+"/"+c,{
method:"DELETE"
});

alert("Eliminado");
listar();
}

// DASHBOARD
async function dashboard(){
const r=await fetch(API+"/CC-resumido");
const d=await r.json();

document.getElementById("dash").innerHTML=
d.map(x=>`
<li>
${x.codigoSigno} | ${x.frecuenciaCardiaca} | ${x.saturacion} | ${x.tipoAle}
</li>
`).join("");
}

</script>

</body>
</html>

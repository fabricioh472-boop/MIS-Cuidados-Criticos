<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alertas por Paciente</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <h1>Alertas por Paciente</h1>

    <!-- LISTAR -->
    <button onclick="listarRelaciones()">Ver Alertas por Paciente</button>

    <table border="1">
        <thead>
            <tr>
                <th>Paciente</th>
                <th>Alerta</th>
                <th>Tipo</th>
                <th>Nivel</th>
            </tr>
        </thead>
        <tbody id="tablaRelaciones"></tbody>
    </table>

    <hr>

    <!-- ASOCIAR -->
    <h3>Asignar alerta a paciente</h3>

    <input id="codigoAlerta" placeholder="Código Alerta">
    <input id="codigoPaciente" placeholder="Código Paciente">
    <button onclick="asignarAlerta()">Asignar</button>

    <script src="../js/alertaPaciente.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Alertas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <h1>Gestión de Alertas</h1>

    <!-- LISTAR -->
    <button onclick="listarAlertas()">Cargar Alertas</button>
    <ul id="listaAlertas"></ul>

    <hr>

    <!-- BUSCAR -->
    <h3>Buscar Alerta</h3>
    <input id="codigoBuscar" placeholder="Código">
    <button onclick="buscarAlerta()">Buscar</button>
    <div id="resultadoBuscar"></div>

    <hr>

    <!-- CREAR -->
    <h3>Crear Alerta</h3>
    <input id="codigo" placeholder="Código">
    <input id="tipo" placeholder="Tipo">
    <input id="nivel" placeholder="Nivel criticidad">
    <button onclick="crearAlerta()">Crear</button>

    <hr>

    <!-- ACTUALIZAR -->
    <h3>Actualizar Alerta</h3>
    <input id="codigoUpdate" placeholder="Código">
    <input id="tipoUpdate" placeholder="Tipo">
    <input id="nivelUpdate" placeholder="Nivel">
    <button onclick="actualizarAlerta()">Actualizar</button>

    <hr>

    <!-- ELIMINAR -->
    <h3>Eliminar Alerta</h3>
    <input id="codigoDelete" placeholder="Código">
    <button onclick="eliminarAlerta()">Eliminar</button>

    <script src="../js/alerta.js"></script>
    

</body>
</html>
